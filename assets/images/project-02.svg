<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="p2bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5F3"/>
      <stop offset="100%" stop-color="#E8DBD5"/>
    </linearGradient>
  </defs>
  <rect width="500" height="350" rx="16" fill="url(#p2bg)"/>
  
  <!-- Skincare Dropper Bottle + Minimal Box -->
  <g transform="translate(160, 60)">
    <!-- Box -->
    <rect x="0" y="40" width="90" height="180" rx="4" fill="#FFFFFF" stroke="#CEB2BE" stroke-width="1.5"/>
    <line x1="15" y1="90" x2="75" y2="90" stroke="#8E7592" stroke-width="0.75"/>
    <text x="45" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#572F54" font-weight="700" text-anchor="middle" letter-spacing="2">NATUREVE</text>
    <text x="45" y="110" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" fill="#8E7592" text-anchor="middle" letter-spacing="1">BOTANICAL SERUM</text>
    <text x="45" y="190" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" fill="#CEB2BE" text-anchor="middle">50ml e 1.7 fl.oz</text>

    <!-- Glass Dropper Bottle -->
    <rect x="110" y="90" width="70" height="130" rx="14" fill="#8E7592" fill-opacity="0.15" stroke="#8E7592" stroke-width="1.5"/>
    <!-- Bottle Cap & Pipette -->
    <rect x="130" y="65" width="30" height="25" rx="3" fill="#572F54"/>
    <path d="M140,65 C140,55 150,55 150,65 Z" fill="#CEB2BE"/>
    <!-- Bottle label -->
    <rect x="118" y="125" width="54" height="60" rx="2" fill="#FFFFFF" fill-opacity="0.9"/>
    <text x="145" y="150" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#572F54" font-weight="600" text-anchor="middle">natureve</text>
    <circle cx="145" cy="165" r="3" fill="#CEB2BE"/>
  </g>

  <!-- Botanical branch decor -->
  <path d="M70,260 Q100,210 130,220 T190,190" fill="none" stroke="#CEB2BE" stroke-width="2"/>
  <circle cx="100" cy="210" r="4" fill="#CEB2BE"/>
  <circle cx="130" cy="220" r="4" fill="#CEB2BE"/>

  <rect x="30" y="290" width="160" height="26" rx="13" fill="#8E7592" fill-opacity="0.85"/>
  <text x="110" y="307" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#FFFFFF" font-weight="600" text-anchor="middle" letter-spacing="1">SKINCARE IDENTITY</text>
</svg>
