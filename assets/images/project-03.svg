<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="p3bg" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8E0E6"/>
      <stop offset="100%" stop-color="#D5C5D1"/>
    </linearGradient>
  </defs>
  <rect width="500" height="350" rx="16" fill="url(#p3bg)"/>

  <!-- Pop-up Camera Gift Box -->
  <g transform="translate(150, 70)">
    <!-- Base Camera Body in Cardboard form -->
    <rect x="0" y="40" width="200" height="150" rx="16" fill="#FAF8F9" stroke="#8E7592" stroke-width="2"/>
    <!-- Top Flash Cube pop-up -->
    <polygon points="30,40 45,10 75,10 60,40" fill="#E3D2C8" stroke="#8E7592" stroke-width="1.5"/>
    <circle cx="53" cy="25" r="7" fill="#572F54"/>

    <!-- Lens rings -->
    <circle cx="100" cy="115" r="46" fill="#8E7592" stroke="#572F54" stroke-width="2"/>
    <circle cx="100" cy="115" r="34" fill="#572F54"/>
    <circle cx="100" cy="115" r="22" fill="#CEB2BE"/>
    <circle cx="94" cy="109" r="6" fill="#FFFFFF" opacity="0.6"/>

    <!-- Polaroid color stripe packaging accent -->
    <g transform="translate(15, 60)">
      <rect x="0" y="0" width="170" height="4" fill="#572F54"/>
      <rect x="0" y="4" width="170" height="4" fill="#8E7592"/>
      <rect x="0" y="8" width="170" height="4" fill="#CEB2BE"/>
      <rect x="0" y="12" width="170" height="4" fill="#E3D2C8"/>
    </g>

    <!-- Emerging photo slide -->
    <g transform="translate(45, 170)">
      <rect x="0" y="0" width="110" height="55" rx="3" fill="#FFFFFF" stroke="#8E7592" stroke-width="1"/>
      <rect x="10" y="8" width="90" height="32" fill="#E8E0E6"/>
      <text x="55" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#572F54" font-weight="600" text-anchor="middle">SWEET MEMORIES</text>
    </g>
  </g>

  <rect x="30" y="290" width="175" height="26" rx="13" fill="#572F54" fill-opacity="0.85"/>
  <text x="117" y="307" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#FFFFFF" font-weight="600" text-anchor="middle" letter-spacing="1">INTERACTIVE GIFT BOX</text>
</svg>
