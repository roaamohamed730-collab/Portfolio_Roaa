<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="p6bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1720"/>
      <stop offset="100%" stop-color="#362939"/>
    </linearGradient>
  </defs>
  <rect width="500" height="350" rx="16" fill="url(#p6bg)"/>

  <!-- Optical Illusion Geometric Folding Facets -->
  <g transform="translate(250, 160)">
    <!-- Polyhedral isometric facets -->
    <polygon points="0,-90 75,-45 0,0 -75,-45" fill="#8E7592" stroke="#CEB2BE" stroke-width="1"/>
    <polygon points="0,0 75,-45 75,45 0,90" fill="#572F54" stroke="#CEB2BE" stroke-width="1"/>
    <polygon points="0,0 0,90 -75,45 -75,-45" fill="#CEB2BE" fill-opacity="0.85" stroke="#CEB2BE" stroke-width="1"/>

    <!-- Concentric optical lines -->
    <g stroke="#E3D2C8" stroke-width="1" fill="none">
      <polygon points="0,-60 50,-30 0,0 -50,-30" opacity="0.7"/>
      <polygon points="0,-30 25,-15 0,0 -25,-15" opacity="0.9"/>
    </g>

    <!-- Emerging geometric succulent sprout -->
    <path d="M0,-80 Q-15,-110 0,-130 Q15,-110 0,-80 Z" fill="#CEB2BE"/>
    <path d="M-8,-90 Q-25,-110 -15,-125 Q-5,-105 -8,-90 Z" fill="#8E7592"/>
    <path d="M8,-90 Q25,-110 15,-125 Q5,-105 8,-90 Z" fill="#E3D2C8"/>
  </g>

  <!-- Title Badge -->
  <rect x="30" y="290" width="190" height="26" rx="13" fill="#572F54" fill-opacity="0.9"/>
  <text x="125" y="307" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#E3D2C8" font-weight="600" text-anchor="middle" letter-spacing="1">PRODUCT &amp; PACKAGING</text>
</svg>
