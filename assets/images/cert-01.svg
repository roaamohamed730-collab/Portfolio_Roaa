  <text x="130" y="255" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#8E7592" text-anchor="middle">AUTHORIZED SIGNATURE</text>
  <line x1="270" y1="240" x2="370" y2="240" stroke="#CEB2BE" stroke-width="1"/>
  <text x="320" y="255" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#8E7592" text-anchor="middle">OFFICIAL STAMP</text>
