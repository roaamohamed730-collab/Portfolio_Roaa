      <stop offset="0%" stop-color="#FAF7F9"/>
      <stop offset="100%" stop-color="#EFE6EC"/>
    </linearGradient>
  </defs>
  <rect width="450" height="300" rx="12" fill="url(#certBg)" stroke="#CEB2BE" stroke-width="2"/>
  <rect x="15" y="15" width="420" height="270" rx="8" fill="none" stroke="#8E7592" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Seal / Emblem -->
  <circle cx="225" cy="80" r="32" fill="#572F54"/>
  <circle cx="225" cy="80" r="26" fill="none" stroke="#E3D2C8" stroke-width="1.5"/>
  <path d="M225,65 L231,76 L243,78 L234,87 L236,99 L225,93 L214,99 L216,87 L207,78 L219,76 Z" fill="#E3D2C8"/>

  <text x="225" y="140" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#572F54" text-anchor="middle" letter-spacing="1">CERTIFICATE OF COMPLETION</text>
  <text x="225" y="165" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#8E7592" text-anchor="middle">2D Motion Graphics Summer Training</text>
  <text x="225" y="190" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#572F54" text-anchor="middle">National Telecommunication Institute (NTI)</text>
  <text x="225" y="210" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#8E7592" text-anchor="middle">120 Training Hours • Certified</text>

  <!-- Bottom ribbons -->
