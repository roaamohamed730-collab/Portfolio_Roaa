<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="p4bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#221C24"/>
      <stop offset="100%" stop-color="#342837"/>
    </linearGradient>
    <linearGradient id="kraft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D9C2B0"/>
      <stop offset="50%" stop-color="#EAD8CA"/>
      <stop offset="100%" stop-color="#CBB3A0"/>
    </linearGradient>
  </defs>
  <rect width="500" height="350" rx="16" fill="url(#p4bg)"/>

  <!-- Cylindrical Kraft Tea Packaging Tube -->
  <g transform="translate(180, 50)">
    <!-- Tube Body -->
    <rect x="0" y="30" width="140" height="200" fill="url(#kraft)" rx="8"/>
    <!-- Lid separator -->
    <line x1="0" y1="80" x2="140" y2="80" stroke="#8E7592" stroke-width="2"/>
    <!-- Label area -->
    <rect x="15" y="95" width="110" height="110" rx="4" fill="#FFFFFF" fill-opacity="0.92"/>
    <!-- Botanical motif -->
    <path d="M70,110 Q85,125 70,140 Q55,125 70,110 Z" fill="#8E7592"/>
    <text x="70" y="160" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#572F54" text-anchor="middle" letter-spacing="3">ROOTS</text>
    <text x="70" y="176" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" fill="#8E7592" text-anchor="middle" letter-spacing="1">HERBAL TEA INFUSION</text>
    <text x="70" y="195" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" fill="#CEB2BE" text-anchor="middle">100% ORGANIC BLEND</text>
  </g>

  <!-- Tea leaves decorative accent -->
  <g transform="translate(70, 160)" opacity="0.3" stroke="#CEB2BE" fill="none">
    <path d="M0,0 Q30,-20 60,0 Q30,20 0,0 Z" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="60" y2="0" stroke-width="1"/>
  </g>

  <rect x="30" y="290" width="160" height="26" rx="13" fill="#8E7592" fill-opacity="0.85"/>
  <text x="110" y="307" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#FFFFFF" font-weight="600" text-anchor="middle" letter-spacing="1">HERBAL TEA REBRAND</text>
</svg>
